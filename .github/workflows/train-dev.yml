name: Train model in dev

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/train-model-parameters.py'
      - 'src/job.yml'
      - '.github/workflows/train-dev.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
    RG_NAME: ${{vars.RESOURCE_GROUP}}
    WS_NAME: ${{vars.WORKSPACE_NAME}}

jobs:
  #env is for env variables and envrionment is for defining which environemnt to deploy this workflow
  train-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OIDC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OIDC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OIDC_AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Detect Azure ML workspace
        id: detect
        run: |
          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-ai300-l found." >&2
            exit 1
          fi

          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-ai300-l found in $RG_NAME." >&2
            exit 1
          fi

          az configure --defaults group="$RG_NAME" workspace="$WS_NAME"

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Run training job in dev and capture logs
        id: train
        run: |
          JOB_NAME="diabetes-train-dev-${{ github.run_id }}"
          echo "Running Azure ML job: $JOB_NAME"
          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-dev-folder@latest

          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for training job
        run: |
          az ml job show \
            --name "${{ steps.train.outputs.JOB_NAME }}" \
            --resource-group "$RG_NAME" \
            --workspace-name "$WS_NAME" \
            --query status \
            --output tsv

          while true; do
            STATUS=$(az ml job show \
              --name "${{ steps.train.outputs.JOB_NAME }}" \
              --resource-group "$RG_NAME" \
              --workspace-name "$WS_NAME" \
              --query status \
              --output tsv)

            echo "Job status: $STATUS"

            case "$STATUS" in
              Completed)
                break
                ;;
              Failed|Canceled|Canceling)
                echo "Training job failed with status: $STATUS"
                exit 1
                ;;
              *)
                sleep 20
                ;;
            esac
          done

      - name: Download Azure ML job logs
        run: |
          mkdir -p azureml-job-files

          az ml job download \
            --name "${{ steps.train.outputs.JOB_NAME }}" \
            --resource-group "$RG_NAME" \
            --workspace-name "$WS_NAME" \
            --download-path azureml-job-files

      - name: Extract dev metrics
        id: parse-metrics
        run: |
          STD_LOG=$(find azureml-job-files -path "*/user_logs/std_log.txt" -type f | head -n 1)

          if [ -z "$STD_LOG" ]; then
            echo "std_log.txt not found"
            exit 1
          fi

          echo "Using log: $STD_LOG"

          ACC=$(grep "Accuracy:" "$STD_LOG" | tail -n 1 | awk '{print $2}')
          AUC=$(grep "AUC:" "$STD_LOG" | tail -n 1 | awk '{print $2}')

          echo "Dev accuracy: $ACC"
          echo "Dev AUC: $AUC"

          echo "dev_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "dev_auc=$AUC" >> "$GITHUB_OUTPUT"

      - name: Comment dev metrics on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.dev_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.dev_auc }}';

            const prNumber = context.payload.pull_request.number;

            let body = '✅ Dev training workflow completed.';
            if (acc || auc) {
              body += '\n\n**Dev evaluation metrics**';
              if (acc) body += `\n- Accuracy: ${acc}`;
              if (auc) body += `\n- AUC: ${auc}`;
            } else {
              body += '\n\nMetrics could not be parsed from logs. Check the Azure Machine Learning job run for details.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
