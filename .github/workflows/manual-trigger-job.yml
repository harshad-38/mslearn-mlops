name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch: #Only when it is dispatched from the Github UI

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@main #On this step azure is checking out the main branch of repository

    - name: Install az ml extension   #At this step Github is installing azure ml extension
      run: az extension add -n ml -y

    - name: Azure login   #At this step Github is loggin into the Azure Account using secrets
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    
    - name: Run Azure Machine Learning training job
      run: az ml job create -f src/job.yml --stream --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }}

      #Resource Group and Workspace Name are fetched from the Github Env Variables 

