name: Train model in prod (PR comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

env:
    RG_NAME: ${{vars.RESOURCE_GROUP}}
    WS_NAME: ${{vars.WORKSPACE_NAME}}

jobs:
  train-prod:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/train-prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OIDC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OIDC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OIDC_AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Detect Azure ML workspace
        id: detect
        run: |
          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-ai300-l found." >&2
            exit 1
          fi

          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-ai300-l found in $RG_NAME." >&2
            exit 1
          fi

          az configure --defaults group="$RG_NAME" workspace="$WS_NAME"

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Run training job in prod
        id: train
        run: |
          JOB_NAME="diabetes-train-prod-${{ github.run_id }}"
          echo "Running Azure ML job in prod: $JOB_NAME"
          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-prod-folder@latest \
            --query name -o tsv

          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for training job
        run: |
          az ml job show \
            --name "${{ steps.train.outputs.job_name }}" \
            --resource-group "$RG_NAME" \
            --workspace-name "$WS_NAME" \
            --query status \
            --output tsv

          while true; do
            STATUS=$(az ml job show \
              --name "${{ steps.train.outputs.job_name }}" \
              --resource-group "$RG_NAME" \
              --workspace-name "$WS_NAME" \
              --query status \
              --output tsv)

            echo "Job status: $STATUS"

            case "$STATUS" in
              Completed)
                break
                ;;
              Failed|Canceled|Canceling)
                echo "Training job failed with status: $STATUS"
                exit 1
                ;;
              *)
                sleep 20
                ;;
            esac
          done

      - name: Download Azure ML job logs
        id: download
        run: |
          mkdir -p azureml-job-files

          az ml job download \
            --name "${{ steps.train.outputs.job_name }}" \
            --resource-group "$RG_NAME" \
            --workspace-name "$WS_NAME" \
            --download-path azureml-job-files
          
          STUDIO_URL=$(az ml job show --name "${{ steps.train.outputs.job_name }}" --query services.Studio.endpoint -o tsv)

          echo "studio_url=$STUDIO_URL" >> "$GITHUB_OUTPUT"

      - name: Extract dev metrics
        id: parse-metrics
        run: |
          STD_LOG=$(find azureml-job-files -path "*/user_logs/std_log.txt" -type f | head -n 1)

          if [ -z "$STD_LOG" ]; then
            echo "std_log.txt not found"
            exit 1
          fi

          echo "Using log: $STD_LOG"

          ACC=$(grep "Accuracy:" "$STD_LOG" | tail -n 1 | awk '{print $2}')
          AUC=$(grep "AUC:" "$STD_LOG" | tail -n 1 | awk '{print $2}')

          echo "Prod accuracy: $ACC"
          echo "Prod AUC: $AUC"

          echo "prod_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "prod_auc=$AUC" >> "$GITHUB_OUTPUT"

      - name: Comment prod metrics on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.prod_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.prod_auc }}';
            const jobName = '${{ steps.train.outputs.job_name }}';
            const studioUrl = '${{ steps.download.outputs.studio_url }}';

            const prNumber = context.issue.number;

            let body = '✅ Prod training workflow completed.';
            body += '\n\n**Azure ML job**';
            body += `\n- Name: ${jobName}`;
            if (studioUrl) body += `\n- Studio: ${studioUrl}`;

            body += '\n\n**Prod evaluation metrics**';
            body += `\n- Accuracy: ${acc}`;
            body += `\n- AUC: ${auc}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
